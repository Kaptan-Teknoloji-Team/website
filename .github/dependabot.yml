# Dependabot configuration file for Kaptan Teknoloji Takımı Website
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Maintain dependencies for npm (Next.js, React, Tailwind, Radix UI, etc.)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "npm"
      - "automated"
    reviewers:
      - "greenkod"
    groups:
      # Group minor and patch updates together to avoid PR noise
      dependencies:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    ignore:
      # Ignore major updates for typescript until Next.js and typescript-eslint support TS 7+
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Maintain dependencies for GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
      - "automated"
    reviewers:
      - "greenkod"
